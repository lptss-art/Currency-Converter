<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Currency Converter</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="./icon-192x192.png">

    <!-- Tailwind CSS (CDN for minimal setup) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Disable number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 selection:bg-blue-200">

    <div class="max-w-md mx-auto min-h-screen flex flex-col p-4">

        <!-- Header -->
        <header class="py-6 text-center">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Converter</h1>
            <p id="lastUpdated" class="text-xs text-gray-500 mt-1">Loading rates...</p>
        </header>

        <!-- Main Input Section -->
        <main class="flex-grow flex flex-col gap-6">

            <!-- Base Currency Input Card -->
            <div class="bg-blue-600 rounded-3xl p-6 shadow-lg shadow-blue-200 text-white relative overflow-hidden">
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-10"></div>

                <div class="flex justify-between items-center mb-4 relative z-10">
                    <label for="amountInput" class="text-blue-100 font-medium">You pay</label>
                    <select id="baseCurrencySelect" class="bg-blue-700/50 border-none text-white text-lg font-bold rounded-xl py-2 pl-3 pr-8 focus:ring-2 focus:ring-white/50 appearance-none cursor-pointer">
                        <option value="EUR">EUR</option>
                    </select>
                </div>

                <div class="relative z-10">
                    <input
                        type="number"
                        id="amountInput"
                        value="1"
                        min="0"
                        step="any"
                        inputmode="decimal"
                        class="w-full bg-transparent border-none text-5xl font-bold text-white placeholder-blue-300 focus:ring-0 p-0"
                        placeholder="0.00"
                    >
                </div>
            </div>

            <!-- Converted Targets List -->
            <div class="flex-grow">
                <div class="flex justify-between items-end mb-3 px-1">
                    <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Converted</h2>
                </div>

                <ul id="targetsList" class="space-y-3">
                    <!-- Target currencies will be injected here via JS -->
                </ul>

                <!-- Add Currency Select -->
                <div class="mt-4 relative">
                    <select id="addCurrencySelect" class="w-full bg-white border border-gray-200 text-gray-700 font-medium rounded-xl py-3 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer shadow-sm text-center">
                        <option value="" disabled selected>+ Add Currency</option>
                        <!-- Options injected via JS -->
                    </select>
                    <!-- Custom chevron -->
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <!-- App Logic -->
    <script src="./app.js"></script>
</body>
</html>
