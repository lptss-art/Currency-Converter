<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Universal Currency Converter</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="./icon-192x192.png">

    <!-- Native App Mode (iOS/Android) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Converter">

    <!-- 100% Local assets: 0ms offline launch & zero CDN delay -->
    <link rel="stylesheet" href="./style.css">
    <script src="./sortable.min.js"></script>
</head>
<body class="bg-gray-50 h-[100dvh] font-sans text-gray-900 flex flex-col overflow-hidden pb-safe">

    <!-- Header -->
    <header class="py-2.5 px-3.5 bg-white border-b border-gray-100 shadow-sm z-10 flex-shrink-0 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <img src="./icon-192x192.png" alt="Logo" class="w-7 h-7 rounded-lg shadow-sm">
            <h1 class="text-base font-bold text-gray-900 tracking-tight">Currency Converter</h1>
        </div>
        <div class="flex items-center gap-1.5 max-w-[55%] justify-end">
            <p id="lastUpdated" class="text-[11px] text-gray-500 text-right leading-tight font-medium">Chargement...</p>
            <button id="refreshRatesBtn" title="Actualiser les taux" aria-label="Actualiser les taux" class="p-1 text-gray-400 hover:text-blue-600 rounded-full transition-colors flex-shrink-0 cursor-pointer">
                <svg id="refreshIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>
    </header>

    <!-- Currency List -->
    <main class="flex-grow overflow-y-auto p-3 flex flex-col gap-2 pb-4" id="currencyList">
        <!-- Currency rows will be injected here -->
    </main>

    <!-- Currency Selection Modal -->
    <div id="currencyModal" class="hidden fixed inset-0 bg-black/50 z-50 flex-col pb-safe">
        <div id="modalSheet" class="mt-auto bg-white rounded-t-3xl max-h-[88dvh] h-[85dvh] flex flex-col shadow-2xl">
            <div class="p-4 border-b flex items-center justify-between flex-shrink-0">
                <h2 class="text-xl font-bold text-gray-900">Choisir une devise</h2>
                <button id="closeModalBtn" aria-label="Fermer" class="p-2 text-gray-400 hover:text-gray-800 cursor-pointer">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 border-b relative flex items-center flex-shrink-0">
                <input type="text" id="currencySearch" placeholder="Rechercher une devise ou un pays..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full bg-gray-100 border-none rounded-xl p-3 pr-10 focus:ring-2 outline-none text-base text-gray-900">
                <button id="clearSearchBtn" aria-label="Effacer la recherche" class="hidden absolute right-7 text-gray-400 hover:text-gray-600 p-1 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modalCurrencyList" class="flex-grow overflow-y-auto p-2 flex flex-col gap-1 pb-safe overscroll-contain">
                <!-- Currency options will be injected here -->
            </div>
        </div>
    </div>

    <!-- Add Currency & Edit Buttons -->
    <div class="px-3 pb-2 flex-shrink-0 bg-gray-50 flex gap-2 mt-1">
        <button id="addCurrencyBtn" class="flex-1 btn-primary-theme text-white font-semibold py-2.5 rounded-xl flex justify-center items-center gap-2 cursor-pointer active:scale-98">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            Ajouter une devise
        </button>
        <button id="toggleDeleteBtn" aria-label="Gérer la liste" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2.5 px-3.5 rounded-xl transition-colors shadow-sm flex justify-center items-center cursor-pointer active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
    </div>

    <!-- Tactile Keypad -->
    <div class="bg-white border-t border-gray-100 shadow-keypad rounded-t-2xl p-2 pb-safe flex-shrink-0 z-20">
        <div class="grid grid-cols-3 gap-1.5 max-w-sm mx-auto mb-1">
            <!-- First row -->
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="1">1</button>
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="2">2</button>
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="3">3</button>

            <!-- Second row -->
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="4">4</button>
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="5">5</button>
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="6">6</button>

            <!-- Third row -->
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="7">7</button>
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="8">8</button>
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="9">9</button>

            <!-- Fourth row -->
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val=".">.</button>
            <button class="keypad-btn keypad-key active:scale-95 cursor-pointer" data-val="0">0</button>
            <button class="keypad-btn bg-red-50 hover:bg-red-100 text-red-600 border border-red-100 flex justify-center items-center py-2.5 rounded-xl transition-colors active:scale-95 cursor-pointer" data-val="delete" aria-label="Effacer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path></svg>
            </button>
        </div>
    </div>

    <!-- App Logic -->
    <script src="./app.js"></script>
</body>
</html>
