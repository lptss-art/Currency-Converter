<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Simple Currency Converter</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141b26" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" href="./logo.svg">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <!-- Native App Mode (iOS/Android) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Currency">

    <!-- 100% Local assets: 0ms offline launch & zero CDN delay -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <button type="button" class="brand" id="aboutBtn" aria-label="About">
            <img src="./logo.svg" alt="" class="brand-logo" width="36" height="36">
            <div class="brand-text">
                <h1 class="brand-title" id="brandTitle">Simple Currency Converter</h1>
                <div class="status" id="ratesStatus" data-state="loading">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="lastUpdated">Loading...</span>
                </div>
            </div>
        </button>
        <div class="header-actions">
            <button id="refreshRatesBtn" title="Refresh rates" aria-label="Refresh rates" class="icon-btn icon-btn-sm">
                <svg id="refreshIcon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>
    </header>

    <!-- Currency List -->
    <main class="currency-list" id="currencyList">
        <!-- Currency rows will be injected here -->
    </main>

    <!-- Bandeau "Annuler" (suppression) -->
    <div class="toast-anchor" id="toastAnchor" aria-live="polite"></div>

    <!-- Add Currency & Edit Buttons -->
    <div class="actions">
        <button id="addCurrencyBtn" class="btn-add">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 5v14M5 12h14"></path></svg>
            <span id="addCurrencyText">Add currency</span>
        </button>
        <button id="toggleDeleteBtn" aria-label="Manage list" class="icon-btn icon-btn-lg">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
    </div>

    <!-- Tactile Keypad -->
    <div class="keypad">
        <div class="keypad-grid">
            <button class="keypad-btn key" data-val="1">1</button>
            <button class="keypad-btn key" data-val="2">2</button>
            <button class="keypad-btn key" data-val="3">3</button>
            <button class="keypad-btn key" data-val="4">4</button>
            <button class="keypad-btn key" data-val="5">5</button>
            <button class="keypad-btn key" data-val="6">6</button>
            <button class="keypad-btn key" data-val="7">7</button>
            <button class="keypad-btn key" data-val="8">8</button>
            <button class="keypad-btn key" data-val="9">9</button>
            <button class="keypad-btn key key-muted" data-val="." id="decimalKey">.</button>
            <button class="keypad-btn key" data-val="0">0</button>
            <button id="deleteBtn" class="keypad-btn key key-muted" data-val="delete" aria-label="Delete">
                <svg width="26" height="26" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path></svg>
            </button>
        </div>
    </div>

    <!-- Currency Selection Modal -->
    <div id="currencyModal" class="sheet-backdrop hidden">
        <div id="modalSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="sheet-handle" aria-hidden="true"></div>
            <div class="sheet-header">
                <h2 id="modalTitle" class="sheet-title">Choose a currency</h2>
                <button id="closeModalBtn" aria-label="Close" class="icon-btn icon-btn-sm">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="search-field">
                <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="2"></circle><path stroke-linecap="round" stroke-width="2" d="M20 20l-3.5-3.5"></path></svg>
                <input type="text" id="currencySearch" class="search-input" placeholder="Currency, country or city…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <button id="clearSearchBtn" aria-label="Clear search" class="search-clear hidden">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modalCurrencyList" class="picker-list">
                <!-- Currency options will be injected here -->
            </div>
        </div>
    </div>

    <!-- À propos -->
    <div id="aboutModal" class="sheet-backdrop hidden">
        <div class="sheet sheet-auto" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
            <div class="sheet-handle" aria-hidden="true"></div>
            <div class="sheet-header">
                <h2 id="aboutTitle" class="sheet-title">About</h2>
                <button id="closeAboutBtn" aria-label="Close" class="icon-btn icon-btn-sm">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="about-body">
                <div class="about-app">
                    <img src="./logo.svg" alt="" width="56" height="56">
                    <div>
                        <div class="about-app-name" id="aboutAppName">Simple Currency Converter</div>
                        <div class="about-app-version" id="aboutVersion"></div>
                    </div>
                </div>
                <section class="about-section">
                    <h3 id="aboutRatesTitle">Exchange rates</h3>
                    <p id="aboutRatesText"></p>
                    <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a>
                </section>
                <section class="about-section">
                    <h3 id="aboutPrivacyTitle">Privacy</h3>
                    <p id="aboutPrivacyText"></p>
                    <a id="aboutPrivacyLink" href="./privacy.html" target="_blank" rel="noopener">Privacy policy</a>
                </section>
                <section class="about-section">
                    <h3 id="aboutContactTitle">Contact</h3>
                    <p id="aboutContactText"></p>
                    <a href="mailto:landolt.studio@gmail.com">landolt.studio@gmail.com</a>
                </section>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script src="./app.js"></script>
</body>
</html>
